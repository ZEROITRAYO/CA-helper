x-backend: &backend
  build:
    context: ./backend
    dockerfile_inline: |
      FROM python:3.12-slim
      RUN apt-get update && apt-get install -y --no-install-recommends tesseract-ocr \
          && rm -rf /var/lib/apt/lists/*
      COPY requirements.txt ./
      RUN pip install --no-cache-dir -r requirements.txt
  volumes: [".:/app"]
  working_dir: /app/backend
  env_file: .env                      
  environment:
    MAIL_SERVER: mailpit
    MAIL_PORT: "1025"

services:
  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["8025:8025"]

  backend:
    <<: *backend
    command: flask --app app run --host 0.0.0.0 --port 8000 --debug
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: python reminders.py
    profiles: ["worker"]  

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:22
        WORKDIR /app/frontend
        COPY package.json ./
        RUN npm install
    volumes: ["./frontend:/app/frontend", "/app/frontend/node_modules"]
    environment: { API_URL: "http://backend:8000" }
    command: npm run dev -- --host 0.0.0.0
    ports: ["5173:5173"]
